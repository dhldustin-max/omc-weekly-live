<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="data.js"></script>
<title>OMC Marketing</title>
<meta name="description" content="OMC Hospitality — ads, promotions, websites and listings, Google and Yelp ratings, competitor changes, by store.">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --accent-soft: #cde2fb;
    --good: #006300; --good-bg: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-bg: #0ca30c; --warn: #fab219; --bad: #e66767;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-bg: #0ca30c; --warn: #fab219; --bad: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { font: inherit; font-weight: 600; padding: 6px 12px; border: 0; background: transparent; color: var(--accent); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--accent); color: #fff; }
  select { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  a.meeting { color: var(--accent); font-weight: 600; text-decoration: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .l { font-size: 12px; color: var(--ink-2); }
  .kpi .v { font-size: 26px; font-weight: 700; margin: 2px 0; white-space: nowrap; }
  .kpi .v .grade { font-size: 15px; padding: 2px 7px; }
  .kpi .d { font-size: 12px; color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 680px; }
  th, td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--grid); white-space: nowrap; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; border-top: 0; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th[aria-sort="descending"]::after { content: " ▼"; } th[aria-sort="ascending"]::after { content: " ▲"; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.store b { display: block; } td.store span { font-size: 12px; color: var(--muted); }
  .meter { display: inline-grid; grid-template-columns: 72px 42px; align-items: center; gap: 8px; }
  .track { position: relative; height: 8px; background: var(--grid); border-radius: 4px; overflow: visible; }
  .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); left: calc(100% / 1.3); }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .grade { display: inline-block; min-width: 26px; text-align: center; font-weight: 700; border-radius: 6px; padding: 2px 6px; color: #fff; }
  .grade.A { background: var(--good-bg); } .grade.B { background: var(--warn); color: #0b0b0b; } .grade.C { background: var(--bad); } .grade.NA { background: var(--muted); }
  .spark { width: 84px; height: 22px; display: block; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark circle { fill: var(--accent); }
  .empty { color: var(--muted); }
  .warn { color: var(--bad); font-weight: 600; }
  h2 { font-size: 14px; margin: 18px 0 8px; } h2 small { font-weight: 400; color: var(--muted); }
  .heat { min-width: 560px; }
  .heat td.cell { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; border: 2px solid var(--surface); border-radius: 6px; }
  .heat th { cursor: default; text-align: right; } .heat th:first-child { text-align: left; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
  footer { color: var(--muted); font-size: 12px; margin-top: 10px; }
  @media (max-width: 600px) { .kpi .v { font-size: 22px; } th, td { padding: 7px 8px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Marketing <small id="sub"></small></h1>
  </header>
  <section class="kpis" id="kpis"></section>
  <section class="panel"><h2>Google vs Yelp</h2><div id="c-ratings" style="min-width:640px"></div></section>
  <div class="card"><table>
    <thead><tr><th>Store</th><th class="num">Google</th><th class="num">Yelp</th><th>Ads</th><th>Promo</th><th class="num">To-do</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p class="muted" style="font-size:12px;margin:8px 2px">Tap a store for details. Red = under 4.0★ or unanswered Yelp reviews.</p>
</main>
<style>
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .muted { color: var(--muted); } .bad { color: var(--bad); font-weight: 700; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good-bg); margin-right: 6px; }
  .badge { display: inline-block; min-width: 22px; text-align: center; border-radius: 99px; padding: 1px 7px; font-weight: 700; font-size: 12px; background: var(--grid); }
  tr.store-row { cursor: pointer; } tr.store-row td:last-child { color: var(--muted); }
  tr.detail td { background: var(--page); white-space: normal; padding: 12px 14px; }
  .det { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 24px; font-size: 13px; }
  .det h4 { margin: 0 0 4px; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .03em; }
  .det ul { margin: 0; padding-left: 16px; } .det li { margin: 2px 0; }
  .det a { color: var(--accent); }
</style>
<script src="chart.js"></script>
<script>
// Marketing at a glance: one row per store (ratings, ads, promo, to-do count); tap a row for details.
// Data: marketing.json (ads refreshed by the daily brief, ratings/Yelp/competitors by the Monday run).
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const md = s => s ? `${+s.slice(5, 7)}/${+s.slice(8)}` : "";
let STORES = [], M = { stores: {} }, OPEN = null;
const star = x => !x || x.rating == null ? `<span class="muted">—</span>` : `<span class="${x.rating < 4 ? "bad" : ""}">${x.rating.toFixed(1)}</span>`;
const short = n => n.replace(" Donkatsu Dublin", "").replace(" Korean Bistro", "").replace("Jjamppong Zizon", "JJ Zizon");

function details(m) {
  const l = m.listings || {}, list = (t, items) => items.length ? `<div><h4>${t}</h4><ul>${items.join("")}</ul></div>` : "";
  const links = [["Website", l.website && l.website.url], ["Google", l.google && l.google.url], ["Yelp", l.yelp && l.yelp.url]].filter(x => x[1]);
  return `<div class="det">` +
    list("Ads", (m.ads || []).map(a => `<li>${esc(a.name.replace(/_/g, " "))} — ${esc(a.status)}${a.spend != null ? `, $${Math.round(a.spend)}` : ""}${a.costPerResult != null ? ` · $${a.costPerResult.toFixed(2)}/${esc(a.resultType || "result")}` : ""}</li>`)) +
    list("Promo", (m.promos || []).map(p => `<li>${esc(p.title)}${p.start || p.end ? ` <span class="muted">${md(p.start)}–${md(p.end)}</span>` : ""}</li>`)) +
    list("Competitors", (m.competitors || []).map(c => `<li><b>${esc(c.name)}</b> ${esc(c.change)}</li>`)) +
    list("To-do", (m.open || []).map(o => `<li>${esc(o)}</li>`)) +
    (links.length ? `<div><h4>Links</h4>${links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`).join(" · ")}</div>` : "") +
    `</div>`;
}

function render() {
  const rows = STORES.map(s => ({ s, m: M.stores[s.id] || {} }));
  const g = rows.map(r => r.m.listings && r.m.listings.google && r.m.listings.google.rating).filter(v => v != null);
  const y = rows.map(r => r.m.listings && r.m.listings.yelp && r.m.listings.yelp.rating).filter(v => v != null);
  const avg = v => v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) : "—";
  const running = rows.reduce((a, r) => a + (r.m.ads || []).filter(x => x.status === "Active").length, 0);
  const todo = rows.reduce((a, r) => a + (r.m.open || []).length, 0);
  document.getElementById("sub").textContent = M.updated ? `updated ${md(M.updated)}` : "";
  document.getElementById("kpis").innerHTML = [["Google avg", avg(g) + "★"], ["Yelp avg", avg(y) + "★"], ["Ads running", running], ["To-do", todo]]
    .map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join("");
  const R = rows.filter(r => r.m.listings && ((r.m.listings.google || {}).rating != null || (r.m.listings.yelp || {}).rating != null));
  groupedBars(document.getElementById("c-ratings"), { categories: R.map(r => short(r.s.name)), fmt: v => v.toFixed(1),
    series: [{ name: "Google", values: R.map(r => (r.m.listings.google || {}).rating ?? null) }, { name: "Yelp", values: R.map(r => (r.m.listings.yelp || {}).rating ?? null) }] });
  document.getElementById("rows").innerHTML = rows.map(({ s, m }) => {
    const l = m.listings || {}, ads = (m.ads || []).filter(a => a.status === "Active"), promo = (m.promos || []).find(p => p.status === "Running");
    const un = l.yelp && l.yelp.unanswered;
    return `<tr class="store-row" data-id="${s.id}"><td><b>${esc(s.name)}</b></td><td class="num">${star(l.google)}</td>
      <td class="num">${star(l.yelp)}${un ? ` <span class="bad">· ${un} unanswered</span>` : ""}</td>
      <td>${ads.length ? `<span class="dot"></span>${ads.length} running` : `<span class="muted">—</span>`}</td>
      <td>${promo ? `<span class="dot"></span>${esc(promo.title.split(/[,(—-]/)[0].trim().slice(0, 28))}` : `<span class="muted">—</span>`}</td>
      <td class="num">${(m.open || []).length ? `<span class="badge">${m.open.length}</span>` : `<span class="muted">—</span>`}</td><td>${OPEN === s.id ? "▴" : "▾"}</td></tr>` +
      (OPEN === s.id ? `<tr class="detail"><td colspan="7">${details(m)}</td></tr>` : "");
  }).join("");
  document.querySelectorAll("tr.store-row").forEach(tr => tr.onclick = () => { OPEN = OPEN === tr.dataset.id ? null : tr.dataset.id; render(); });
}

(async () => {
  const [html, mk] = await Promise.all([
    fetch("index.html", { cache: "no-store" }).then(r => r.text()),
    fetch("marketing.json", { cache: "no-store" }).then(r => r.ok ? r.json() : { stores: {} }).catch(() => ({ stores: {} })),
  ]);
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date());
  STORES = new Function("return " + html.match(/const STORES = (\[[\s\S]*?\n  \]);/)[1])().filter(s => !s.closedFrom || s.closedFrom > today);
  M = mk; OPEN = new URLSearchParams(location.search).get("id") || (STORES.length === 1 ? STORES[0].id : null);
  render();
})();
</script>
<script src="nav.js"></script>
</body>
</html>
