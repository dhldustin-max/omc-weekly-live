<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="data.js"></script>
<title>OMC Marketing</title>
<meta name="description" content="OMC Hospitality — ads, promotions, websites and listings, Google and Yelp ratings, competitor changes, by store.">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --accent-soft: #cde2fb;
    --good: #006300; --good-bg: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-bg: #0ca30c; --warn: #fab219; --bad: #e66767;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-bg: #0ca30c; --warn: #fab219; --bad: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { font: inherit; font-weight: 600; padding: 6px 12px; border: 0; background: transparent; color: var(--accent); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--accent); color: #fff; }
  select { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  a.meeting { color: var(--accent); font-weight: 600; text-decoration: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .l { font-size: 12px; color: var(--ink-2); }
  .kpi .v { font-size: 26px; font-weight: 700; margin: 2px 0; white-space: nowrap; }
  .kpi .v .grade { font-size: 15px; padding: 2px 7px; }
  .kpi .d { font-size: 12px; color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 680px; }
  th, td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--grid); white-space: nowrap; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; border-top: 0; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th[aria-sort="descending"]::after { content: " ▼"; } th[aria-sort="ascending"]::after { content: " ▲"; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.store b { display: block; } td.store span { font-size: 12px; color: var(--muted); }
  .meter { display: inline-grid; grid-template-columns: 72px 42px; align-items: center; gap: 8px; }
  .track { position: relative; height: 8px; background: var(--grid); border-radius: 4px; overflow: visible; }
  .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); left: calc(100% / 1.3); }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .grade { display: inline-block; min-width: 26px; text-align: center; font-weight: 700; border-radius: 6px; padding: 2px 6px; color: #fff; }
  .grade.A { background: var(--good-bg); } .grade.B { background: var(--warn); color: #0b0b0b; } .grade.C { background: var(--bad); } .grade.NA { background: var(--muted); }
  .spark { width: 84px; height: 22px; display: block; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark circle { fill: var(--accent); }
  .empty { color: var(--muted); }
  .warn { color: var(--bad); font-weight: 600; }
  h2 { font-size: 14px; margin: 18px 0 8px; } h2 small { font-weight: 400; color: var(--muted); }
  .heat { min-width: 560px; }
  .heat td.cell { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; border: 2px solid var(--surface); border-radius: 6px; }
  .heat th { cursor: default; text-align: right; } .heat th:first-child { text-align: left; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
  footer { color: var(--muted); font-size: 12px; margin-top: 10px; }
  @media (max-width: 600px) { .kpi .v { font-size: 22px; } th, td { padding: 7px 8px; } }
</style>
</head>
<style>
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 8px; background: var(--grid); color: var(--ink-2); }
  .pill.on { background: color-mix(in srgb, var(--good-bg) 20%, transparent); color: var(--good); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .muted { color: var(--muted); } .bad { color: var(--bad); font-weight: 700; }
  ul.plain { margin: 0; padding-left: 18px; } ul.plain li { margin: 3px 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  td a { color: var(--accent); }
</style>
<body>
<main>
  <header>
    <h1>Marketing <small id="sub"></small></h1>
    <span class="spacer"></span>
    <select id="store" aria-label="Store"></select>
  </header>
  <section class="kpis" id="kpis"></section>
  <section class="panel"><h2>Ratings — Google vs Yelp</h2><div id="c-ratings" style="min-width:640px"></div></section>
  <section class="panel"><h2>Ads</h2><div class="card"><table><thead><tr><th>Store</th><th>Campaign</th><th>Status</th><th>Dates</th><th class="num">Spend</th><th class="num">Results</th><th class="num">Cost / result</th></tr></thead><tbody id="ads"></tbody></table></div></section>
  <div class="grid2">
    <section class="panel"><h2>Promotions</h2><div id="promos"></div></section>
    <section class="panel"><h2>Competitor changes</h2><div id="comps"></div></section>
  </div>
  <section class="panel"><h2>Websites &amp; listings</h2><div class="card"><table><thead><tr><th>Store</th><th>Website</th><th class="num">Google</th><th class="num">Yelp</th><th class="num">Unanswered Yelp</th><th>Note</th></tr></thead><tbody id="listings"></tbody></table></div></section>
  <section class="panel"><h2>Open items</h2><div id="open"></div></section>
  <p class="muted" id="note" style="font-size:12px"></p>
</main>
<script src="chart.js"></script>
<script>
// Marketing by store, from marketing.json (kept up to date by the daily brief for ads and the Monday
// weekly run for ratings, Yelp replies and competitors). Flags: Yelp under 4.0 with 500+ reviews is
// urgent (review-analyst rule); a rating under 4.0 or unanswered Yelp reviews show red.
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const money = v => v == null ? "—" : "$" + Math.round(v).toLocaleString("en-US");
const md = s => s ? `${+s.slice(5, 7)}/${+s.slice(8)}` : "";
const rng = (a, b) => a || b ? `${md(a) || "…"}–${md(b) || "…"}` : "—";
let STORES = [], M = { stores: {} };

function stars(x) {
  if (!x || x.rating == null) return `<span class="muted">—</span>`;
  const bad = x.rating < 4 || (x.reviews >= 500 && x.rating < 4);
  return `<span class="${bad ? "bad" : ""}">${x.rating.toFixed(1)}★</span> <span class="muted">${x.reviews != null ? x.reviews.toLocaleString() : ""}</span>`;
}
const link = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : `<span class="muted">—</span>`;

function render() {
  const pick = document.getElementById("store").value;
  const list = STORES.filter(s => pick === "*" || s.id === pick).map(s => ({ s, m: M.stores[s.id] || {} }));
  history.replaceState(null, "", pick === "*" ? location.pathname : "?id=" + pick);
  const ads = list.flatMap(({ s, m }) => (m.ads || []).map(a => ({ s, a })));
  const active = ads.filter(x => x.a.status === "Active");
  const promos = list.flatMap(({ s, m }) => (m.promos || []).map(p => ({ s, p })));
  const L = list.map(({ s, m }) => ({ s, l: m.listings || {} }));
  const avg = k => { const v = L.map(x => x.l[k] && x.l[k].rating).filter(v => v != null); return v.length ? (v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) + "★" : "—"; };
  const unanswered = L.reduce((a, x) => a + ((x.l.yelp && x.l.yelp.unanswered) || 0), 0);
  const opens = list.flatMap(({ s, m }) => (m.open || []).map(o => ({ s, o })));
  document.getElementById("sub").textContent = M.updated ? `updated ${M.updated}` : "";
  document.getElementById("kpis").innerHTML = [
    ["Active ad campaigns", active.length, money(active.reduce((a, x) => a + (x.a.spend || 0), 0)) + " spend shown"],
    ["Running promotions", promos.filter(x => x.p.status === "Running").length, `${promos.filter(x => x.p.status === "Planned").length} planned`],
    ["Avg Google", avg("google"), `${L.filter(x => x.l.google && x.l.google.rating != null).length} stores rated`],
    ["Avg Yelp", avg("yelp"), unanswered ? `<span class="bad">${unanswered} unanswered</span>` : "no unanswered on record"],
    ["Open items", opens.length, "listings, websites, ads"],
  ].map(k => `<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join("");

  const R = L.filter(x => (x.l.google && x.l.google.rating != null) || (x.l.yelp && x.l.yelp.rating != null));
  const short = n => n.replace(" Donkatsu Dublin", "").replace(" Korean Bistro", "").replace("Jjamppong Zizon", "JJ Zizon");
  groupedBars(document.getElementById("c-ratings"), { categories: R.map(x => short(x.s.name)), fmt: v => v.toFixed(1),
    series: [{ name: "Google", values: R.map(x => x.l.google && x.l.google.rating) }, { name: "Yelp", values: R.map(x => x.l.yelp && x.l.yelp.rating) }] });

  document.getElementById("ads").innerHTML = ads.length ? ads.map(({ s, a }) => `<tr><td class="store"><b>${esc(s.name)}</b><span>${esc(a.platform || "")}</span></td>
    <td>${esc(a.name)}${a.note ? `<br><span class="muted" style="font-size:12px">${esc(a.note)}</span>` : ""}</td>
    <td><span class="pill ${a.status === "Active" ? "on" : ""}">${esc(a.status || "—")}</span></td><td>${rng(a.start, a.end)}</td>
    <td class="num">${money(a.spend)}${a.spendPeriod ? `<br><span class="muted" style="font-size:11px">${esc(a.spendPeriod)}</span>` : ""}</td>
    <td class="num">${a.results ?? "—"}${a.resultType ? `<br><span class="muted" style="font-size:11px">${esc(a.resultType)}</span>` : ""}</td>
    <td class="num">${a.costPerResult != null ? "$" + a.costPerResult.toFixed(2) : "—"}</td></tr>`).join("")
    : `<tr><td colspan="7" class="muted">No campaigns on record</td></tr>`;

  document.getElementById("promos").innerHTML = promos.length ? `<ul class="plain">${promos.map(({ s, p }) =>
    `<li><span class="pill ${p.status === "Running" ? "on" : ""}">${esc(p.status)}</span> <b>${esc(p.title)}</b> — ${esc(s.name)} <span class="muted">${rng(p.start, p.end)}${p.where ? " · " + esc(p.where) : ""}</span></li>`).join("")}</ul>` : `<p class="muted">None on record</p>`;

  const comps = list.flatMap(({ s, m }) => (m.competitors || []).map(c => ({ s, c })));
  document.getElementById("comps").innerHTML = comps.length ? `<ul class="plain">${comps.map(({ s, c }) =>
    `<li><b>${esc(c.name)}</b> <span class="muted">(vs ${esc(s.name)}${c.date ? ", " + md(c.date) : ""})</span> — ${esc(c.change)}</li>`).join("")}</ul>` : `<p class="muted">No changes on record</p>`;

  document.getElementById("listings").innerHTML = L.map(({ s, l }) => {
    const y = l.yelp || {}, g = l.google || {}, w = l.website || {};
    return `<tr><td class="store"><b><a href="store.html?id=${s.id}" style="color:inherit">${esc(s.name)}</a></b></td>
      <td>${w.url ? link(w.url, w.url.replace(/^https?:\/\//, "").replace(/\/$/, "")) : `<span class="muted">${esc(w.status || "—")}</span>`}</td>
      <td class="num">${g.url ? `<a href="${esc(g.url)}" target="_blank" rel="noopener" style="color:inherit">${stars(g)}</a>` : stars(g)}</td>
      <td class="num">${y.url ? `<a href="${esc(y.url)}" target="_blank" rel="noopener" style="color:inherit">${stars(y)}</a>` : stars(y)}</td>
      <td class="num">${y.unanswered ? `<span class="bad">${y.unanswered}</span>` : y.unanswered === 0 ? "0" : "—"}</td>
      <td style="white-space:normal;font-size:12px">${esc([g.note, y.note, w.status && w.url ? w.status : ""].filter(Boolean).join(" · "))}</td></tr>`;
  }).join("");

  document.getElementById("open").innerHTML = opens.length ? `<ul class="plain">${opens.map(({ s, o }) => `<li><b>${esc(s.name)}</b> — ${esc(o)}</li>`).join("")}</ul>` : `<p class="muted">Nothing open</p>`;
  document.getElementById("note").textContent = "Ratings show the latest snapshot on record (see the as-of date in the data). Red: rating under 4.0, or unanswered Yelp reviews.";
}

(async () => {
  const [html, mk] = await Promise.all([
    fetch("index.html", { cache: "no-store" }).then(r => r.text()),
    fetch("marketing.json", { cache: "no-store" }).then(r => r.ok ? r.json() : { stores: {} }).catch(() => ({ stores: {} })),
  ]);
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date());
  STORES = new Function("return " + html.match(/const STORES = (\[[\s\S]*?\n  \]);/)[1])().filter(s => !s.closedFrom || s.closedFrom > today);
  M = mk;
  const sel = document.getElementById("store");
  sel.innerHTML = (STORES.length > 1 ? `<option value="*">All stores</option>` : "") + STORES.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  sel.value = new URLSearchParams(location.search).get("id") || sel.options[0].value;
  if (!sel.value) sel.value = sel.options[0].value;
  sel.onchange = render; render();
})();
</script>
<script src="nav.js"></script>
</body>
</html>
