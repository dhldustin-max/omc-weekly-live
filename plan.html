<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="data.js"></script>
<title>OMC Labor Plan</title>
<meta name="description" content="How many staff hours each day can use to stay under 25% labor, from expected sales.">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --accent-soft: #cde2fb;
    --good: #006300; --good-bg: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-bg: #0ca30c; --warn: #fab219; --bad: #e66767;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #184f95;
    --good: #0ca30c; --good-bg: #0ca30c; --warn: #fab219; --bad: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; }
  h1 small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { font: inherit; font-weight: 600; padding: 6px 12px; border: 0; background: transparent; color: var(--accent); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--accent); color: #fff; }
  select { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  a.meeting { color: var(--accent); font-weight: 600; text-decoration: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .l { font-size: 12px; color: var(--ink-2); }
  .kpi .v { font-size: 26px; font-weight: 700; margin: 2px 0; white-space: nowrap; }
  .kpi .v .grade { font-size: 15px; padding: 2px 7px; }
  .kpi .d { font-size: 12px; color: var(--ink-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 680px; }
  th, td { padding: 8px 10px; text-align: left; border-top: 1px solid var(--grid); white-space: nowrap; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; border-top: 0; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th[aria-sort="descending"]::after { content: " ▼"; } th[aria-sort="ascending"]::after { content: " ▲"; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  td.store b { display: block; } td.store span { font-size: 12px; color: var(--muted); }
  .meter { display: inline-grid; grid-template-columns: 72px 42px; align-items: center; gap: 8px; }
  .track { position: relative; height: 8px; background: var(--grid); border-radius: 4px; overflow: visible; }
  .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); left: calc(100% / 1.3); }
  .up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .grade { display: inline-block; min-width: 26px; text-align: center; font-weight: 700; border-radius: 6px; padding: 2px 6px; color: #fff; }
  .grade.A { background: var(--good-bg); } .grade.B { background: var(--warn); color: #0b0b0b; } .grade.C { background: var(--bad); } .grade.NA { background: var(--muted); }
  .spark { width: 84px; height: 22px; display: block; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark circle { fill: var(--accent); }
  .empty { color: var(--muted); }
  .warn { color: var(--bad); font-weight: 600; }
  h2 { font-size: 14px; margin: 18px 0 8px; } h2 small { font-weight: 400; color: var(--muted); }
  .heat { min-width: 560px; }
  .heat td.cell { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; border: 2px solid var(--surface); border-radius: 6px; }
  .heat th { cursor: default; text-align: right; } .heat th:first-child { text-align: left; }
  .legend { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { width: 18px; height: 10px; border-radius: 3px; display: inline-block; }
  footer { color: var(--muted); font-size: 12px; margin-top: 10px; }
  @media (max-width: 600px) { .kpi .v { font-size: 22px; } th, td { padding: 7px 8px; } }
</style>
</head>
<style>
  main { max-width: 720px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .row select { font-size: 16px; padding: 8px 10px; }
  .days { display: grid; gap: 10px; }
  .day { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .day .d { font: 700 20px system-ui; }
  .day .s { color: var(--ink-2); font-size: 14px; }
  .day .h { font: 800 28px system-ui; text-align: right; } .day .h small { font: 600 14px system-ui; color: var(--muted); }
  .day .last { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
  .day .last.over { color: var(--bad); font-weight: 700; }
  .total { margin-top: 14px; font: 700 18px system-ui; text-align: right; }
  .hint { color: var(--muted); font-size: 14px; }
</style>
<body>
<main>
  <header><h1 id="title">Labor plan</h1></header>
  <div class="row"><select id="store" aria-label="Store"></select></div>
  <p class="hint" id="hint"></p>
  <div class="days" id="days"></div>
  <div class="total" id="total"></div>
</main>
<script>
// Labor plan for next week (Mon–Sun). Expected sales per weekday = average of that weekday over the
// last 4 weeks (daily.json). Budget = 25% of expected sales ÷ average hourly pay → hours to schedule.
// Average pay: hourly wages ÷ hours from the store's latest submitted payroll, else DEFAULT_RATE.
// "Last week": Verona clock hours, or Toast timecard labor $ ÷ pay (≈ hours).
const LIMIT = 0.25, DEFAULT_RATE = 19;
const iso = d => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(d);
const add = (s, k) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + k); return iso(d); };
const md = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;
const money = v => "$" + Math.round(v).toLocaleString("en-US");
const $ = id => document.getElementById(id);
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
let STORES = [], DAILY = {}, PAY = {};
function thisMonday() { const t = iso(new Date()), dow = new Date(t + "T12:00:00").getDay(); return add(t, -((dow + 6) % 7)); }

function render() {
  const id = $("store").value, s = STORES.find(x => x.id === id), next = add(thisMonday(), 7), last = add(thisMonday(), -7);
  history.replaceState(null, "", "?id=" + id);
  const paid = Object.keys(PAY).sort().reverse().map(p => (PAY[p].stores || {})[id]).find(v => v && v.wages && v.hours);
  const rate = paid ? paid.wages / paid.hours : DEFAULT_RATE;
  $("title").textContent = `Labor plan — ${s.name}`;
  $("hint").textContent = `Next week ${md(next)}–${md(add(next, 6))}. Hours you can schedule each day and stay under 25% labor. ` +
    `Based on sales of the last 4 weeks and $${rate.toFixed(2)}/hour ${paid ? "(your last payroll)" : "(estimate until your first payroll)"}.`;
  let totH = 0, totS = 0;
  $("days").innerHTML = DAYS.map((dname, i) => {
    const prev = [1, 2, 3, 4].map(k => (DAILY[add(next, i - 7 * k)] || {})[id]).filter(v => v && v.sales != null && v.sales > 0);
    const exp = prev.length ? prev.reduce((a, v) => a + v.sales, 0) / prev.length : 0;
    const hours = exp * LIMIT / rate; totH += hours; totS += exp;
    const lv = (DAILY[add(last, i)] || {})[id] || {}, used = lv.hours || (lv.labor ? lv.labor / rate : 0), budgetLast = (lv.sales || 0) * LIMIT / rate;
    const lastTxt = used ? `Last ${dname}: used ${Math.round(used)} h${budgetLast ? ` (budget was ${Math.round(budgetLast)} h)` : ""}` : "";
    return `<div class="day"><div class="d">${dname}<br><span class="s">${md(add(next, i))}</span></div>
      <div class="s">${exp ? `Expected sales ${money(exp)}` : "Closed or no history"}</div>
      <div class="h">${exp ? Math.round(hours) : "—"}<small> h</small></div>
      ${lastTxt ? `<div class="last ${used > budgetLast * 1.05 ? "over" : ""}">${lastTxt}${used > budgetLast * 1.05 ? " ⚠ over" : ""}</div>` : ""}</div>`;
  }).join("");
  $("total").textContent = `Week: up to ${Math.round(totH)} hours · expected sales ${money(totS)}`;
}
(async () => {
  const [html, daily, pay] = await Promise.all([fetch("index.html").then(r => r.text()), fetch("daily.json").then(r => r.json()).catch(() => ({ days: {} })),
    fetch("payroll.json").then(r => r.ok ? r.json() : { periods: {} }).catch(() => ({ periods: {} }))]);
  const today = iso(new Date());
  STORES = new Function("return " + html.match(/const STORES = (\[[\s\S]*?\n  \]);/)[1])().filter(s => !s.closedFrom || s.closedFrom > today);
  DAILY = daily.days || {}; PAY = pay.periods || {};
  $("store").innerHTML = STORES.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
  const want = new URLSearchParams(location.search).get("id"); if (want && STORES.some(s => s.id === want)) $("store").value = want;
  $("store").hidden = STORES.length < 2;
  $("store").onchange = render; render();
})();
</script>
<script src="nav.js"></script>
</body>
</html>
