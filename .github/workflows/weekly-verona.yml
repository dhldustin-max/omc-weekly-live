# Weekly Verona scrape (7 stores) — runs on GitHub's servers, no Mac required.
#
# Replaces the Mac launchd job (com.omc.weekly-update). Same script, same
# logic: scripts/weekly-update.js --include-verona. The script no-ops when the
# target week is already 7/7, so the retry crons are safe to fire.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERONA_EMAIL
#   VERONA_PASSWORD
#
# Manual run / backfill / dry-run: Actions tab → "Weekly Verona scrape" → Run workflow.
#   dry_run=true  → full login + scrape, prints results, writes/pushes nothing.
#   week=YYYY-MM-DD (a Monday) → backfill that week instead of last completed week.
#
# Schedule is UTC. Business week is Mon–Sun America/Los_Angeles; the script
# computes that itself (timezone-safe). 15:00 UTC = 07:00 PST / 08:00 PDT.

name: Weekly Verona scrape

on:
  schedule:
    - cron: '0 15 * * 1'   # Mon 15:00 UTC — main run
    - cron: '0 22 * * 1'   # Mon 22:00 UTC — retry (no-op if complete)
    - cron: '0 15 * * 2'   # Tue 15:00 UTC — retry (no-op if complete)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scrape but do not write/commit/push)'
        type: boolean
        default: false
      week:
        description: 'Backfill week start (YYYY-MM-DD, a Monday). Leave blank for last completed week.'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: weekly-verona
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Write .env from secrets
        env:
          VERONA_EMAIL: ${{ secrets.VERONA_EMAIL }}
          VERONA_PASSWORD: ${{ secrets.VERONA_PASSWORD }}
        run: |
          if [ -z "$VERONA_EMAIL" ] || [ -z "$VERONA_PASSWORD" ]; then
            echo "::error::VERONA_EMAIL / VERONA_PASSWORD secrets are not set. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf 'VERONA_EMAIL=%s\nVERONA_PASSWORD=%s\n' "$VERONA_EMAIL" "$VERONA_PASSWORD" > .env
          chmod 600 .env

      - name: Configure git identity
        run: |
          git config user.name  "OMC weekly bot (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Verona scrape
        env:
          TZ: America/Los_Angeles
          DRY_RUN: ${{ inputs.dry_run }}
          WEEK: ${{ inputs.week }}
        run: |
          ARGS="--include-verona"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$WEEK" ]; then
            if ! echo "$WEEK" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::week must be YYYY-MM-DD"; exit 1
            fi
            ARGS="$ARGS --week $WEEK"
          fi
          echo "node scripts/weekly-update.js $ARGS"
          node scripts/weekly-update.js $ARGS

      - name: Remove .env
        if: always()
        run: rm -f .env
